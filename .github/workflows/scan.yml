name: Accessibility Scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to scan'
        required: true
        type: string
      api_key:
        description: 'Gemma API key (leave empty to use repo secret GEMMA_API_KEY)'
        required: false
        type: string
      model:
        description: 'Model name (default: gemma-4-31b-it)'
        required: false
        default: 'gemma-4-31b-it'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Set report folder name
        run: echo "REPORT_ID=$(date -u +'%Y-%m-%d-%H%M%S')-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Restore previous reports from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          mkdir -p _site/reports
          git checkout origin/gh-pages -- reports 2>/dev/null && mv reports _site/reports || true

      - name: Run accessibility scan
        run: node src/cli.js --url "$SCAN_URL" --backend google-ai --model "$SCAN_MODEL" --api-key "$SCAN_API_KEY" --format html --output "_site/reports/$REPORT_ID/index.html"
        env:
          SCAN_URL: ${{ inputs.url }}
          SCAN_MODEL: ${{ inputs.model }}
          SCAN_API_KEY: ${{ inputs.api_key || secrets.GEMMA_API_KEY }}
          GEMMA_BACKEND: google-ai

      - name: Prune old reports and build index
        run: node src/build-index.js _site

      - name: Upload report as artifact (zip download)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report-${{ env.REPORT_ID }}
          path: _site/reports/${{ env.REPORT_ID }}/index.html
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
